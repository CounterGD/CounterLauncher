name: Build ARM64 Launcher
on: [push]

jobs:
  build:
    # Use GitHub's native ARM64 runner
    runs-on: ubuntu-24.04-arm 
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appimage-builder squashfs-tools
          
      - name: Build AppImage
        run: |
          # Your commands to bundle your app into an AppDir
          # Then run the builder
          appimage-builder --recipe AppImageBuilder.yml
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLauncher-ARM64
          path: "*.AppImage"
          
